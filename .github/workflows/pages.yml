name: deploy-github-pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Integrity gate — runs on EVERY push AND every PR against any branch. This is the
  # required status check named 'validate' that protects main; it must go green before
  # any PR can merge (branch protection depends on this exact job name).
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate library gates
        run: tools/validate.sh

  # Deploy — main-push only. Runs AFTER validate passes, so the published site is always
  # built from a catalog-consistent tree (validate gates it upstream via branch protection).
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject build info (commit SHA + YY-MM-DD) into PWA header
        run: |
          SHA="${{ github.sha }}"
          DATE="${{ github.event.head_commit.timestamp }}"
          if [ -z "$DATE" ]; then DATE="$(date -u '+%Y-%m-%d')"; fi
          # Trim to YY-MM-DD (drop century) so the 'upd:' header line doesn't wrap
          DATE="${DATE:2:8}"
          sed -i "s|__BUILD_SHA__|$SHA|g; s|__BUILD_DATE__|$DATE|g" pwa/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4